[package]
name = "miring"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Pure-Rust io_uring emulator — Miri-compatible, API-compatible with io-uring 0.7"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elide-tools/miring"
keywords = ["io_uring", "miri", "emulator", "testing", "uring"]
categories = ["development-tools::testing", "asynchronous", "os::linux-apis"]

[dependencies]
bitflags = "2"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
